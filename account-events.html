    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Restore user name
            const userName = localStorage.getItem('madfun_user') || 'Tyler';
            document.getElementById('userNameSpan').innerText = userName;

            // User dropdown
            const userMenuBtn = document.getElementById('userMenuBtn');
            const userDropdown = document.getElementById('userDropdown');
            if (userMenuBtn && userDropdown) {
                userMenuBtn.addEventListener('click', function() {
                    userDropdown.classList.toggle('open');
                });
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.user-menu')) {
                        userDropdown.classList.remove('open');
                    }
                });
            }

            // Events List
            let allEvents = [
                { id: 1, title: "Nakuru Kids Festival Season 3", org: "Destiny Mentors Events", date: "25 Jul, 2026", venue: "Kunste Hotels Gardens, Nakuru", image: "https://gigs.madfun.com/images/events/kutiit-culture.jpg" },
                { id: 2, title: "Nexora Social Club - Tropical Beach Experience", org: "Nexora Social Club", date: "26 Jul, 2026", venue: "Tropical Beach, Ruiru", image: "https://gigs.madfun.com/images/events/3rd-service.jpg" },
                { id: 3, title: "African Twist: The Soundtrack Of Kenya's Independence", org: "Ketebul Music", date: "30 Jul, 2026", venue: "Alliance Francaise Nairobi", image: "https://gigs.madfun.com/images/events/call-experience.jpg" },
                { id: 4, title: "The Bloom Experience Kenya 2026", org: "Our Bloom Nation", date: "01 Aug, 2026", venue: "Hilton Building, CBD Nairobi", image: "https://gigs.madfun.com/images/events/cocktail-runs.jpg" },
                { id: 5, title: "Kikuyu Comedy Night (Nairobi Edition)", org: "Kymly Creatives", date: "25 Jul, 2026", venue: "Sarakasi Dome, Nairobi", image: "https://gigs.madfun.com/images/events/what-we-never-said.jpg" },
                { id: 6, title: "Mugithi & Rhumba Night", org: "Vibanda Village", date: "25 Jul, 2026", venue: "Vibanda Village", image: "https://madfun.online/assets/img/banners/oak-grove-desktop.jpeg" },
                { id: 7, title: "Ollin Youth Summit", org: "Ollin Youth Summit", date: "25 Jul, 2026", venue: "Kerugoya Stadium", image: "https://madfun.online/assets/img/banners/ttnt6-desktop.webp" },
                { id: 8, title: "Rhythm And Rhumba Festival", org: "Signature Events", date: "26 Jul, 2026", venue: "Avery Lounge, Athi River", image: "https://madfun.online/assets/img/banners/maitu-desktop.webp" }
            ];

            const grid = document.getElementById('eventsDisplayGrid');

            function renderEvents(list) {
                grid.innerHTML = list.map(e => `
                    <div class="inner-event-card">
                        <div class="inner-event-img-wrap">
                            <img src="${e.image}" alt="${e.title}" onerror="this.src='https://madfun.online/assets/img/banners/oak-grove-desktop.jpeg'" />
                        </div>
                        <div class="inner-event-info">
                            <h3 class="inner-event-title">${e.title}</h3>
                            <p class="inner-event-org">organized by ${e.org || 'Madfun'}</p>
                            <p class="inner-event-date">${e.date || ''}</p>
                            <p class="inner-event-venue">${e.venue || ''}</p>
                            <a href="event.html?id=${e.id || e.docId}" class="inner-event-buy-btn">BUY TICKETS</a>
                        </div>
                    </div>
                `).join('');
            }

            if (typeof db !== 'undefined') {
                db.collection('events').onSnapshot(snapshot => {
                    if (!snapshot.empty) {
                        allEvents = [];
                        snapshot.forEach(doc => {
                            const d = doc.data();
                            allEvents.push({
                                docId: doc.id,
                                id: d.id || doc.id,
                                title: d.title,
                                org: d.org,
                                date: d.date,
                                venue: d.venue,
                                image: d.image
                            });
                        });
                    }
                    renderEvents(allEvents);
                }, () => renderEvents(allEvents));
            } else {
                renderEvents(allEvents);
            }

            // Search filter
            document.getElementById('eventSearchInput').addEventListener('input', function(e) {
                const query = e.target.value.toLowerCase();
                const filtered = allEvents.filter(ev => 
                    (ev.title || '').toLowerCase().includes(query) || 
                    (ev.org || '').toLowerCase().includes(query) || 
                    (ev.venue || '').toLowerCase().includes(query)
                );
                renderEvents(filtered);
            });
        });
    </script>
